# Use Ctrl+B as the prefix key (default)
set -g prefix C-b
bind C-b send-prefix

# Use Vim shortcuts
setw -g mode-keys vi

# True color support
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Mouse support (click panes, scroll, select text within pane)
# Toggle with prefix+m if needed
set -g mouse on
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"
# OSC 52 - clipboard works over SSH (no xclip needed on remote)
set -g set-clipboard on

# Windows numbered from 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# New windows/panes open in current directory
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vi copy mode: v to begin selection (y to yank via tmux-yank)
bind -T copy-mode-vi v send-keys -X begin-selection

# Pane navigation with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Plugins (managed by tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min
set -g @continuum-restore 'on'

# Status bar
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left '#[fg=#7aa2f7,bold] #S '
set -g status-right '#[fg=#7aa2f7]%Y-%m-%d #[fg=#bb9af7]%H:%M '
set -g status-left-length 20
setw -g window-status-current-style 'fg=#7aa2f7,bold'
setw -g window-status-style 'fg=#565f89'

# Initialize tpm (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
