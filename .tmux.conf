# Use Ctrl+A as the prefix key
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Use Vim shortcuts
setw -g mode-keys vi

# Make `Ctrl+A R` reload the config file
unbind r
bind r source-file ~/.tmux.conf

# No delay after pressing Esc (critical for vim)
set -sg escape-time 0

# Mouse support (resize panes, select windows, scroll)
set -g mouse on

# Windows numbered from 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Plugins (managed by tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min
set -g @continuum-restore 'on'

# Initialize tpm (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
