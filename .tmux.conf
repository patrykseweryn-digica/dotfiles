# Use Ctrl+B as the prefix key (default)
set -g prefix C-b
bind C-b send-prefix

# Use Vim shortcuts
setw -g mode-keys vi

# Mouse support (resize panes, select windows, scroll)
set -g mouse on

# Windows numbered from 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed (no gaps)
set -g renumber-windows on

# Plugins (managed by tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min
set -g @continuum-restore 'on'

# Status bar
set -g status-style 'bg=#1a1b26,fg=#a9b1d6'
set -g status-left '#[fg=#7aa2f7,bold] #S '
set -g status-right '#[fg=#7aa2f7]%Y-%m-%d #[fg=#bb9af7]%H:%M '
set -g status-left-length 20
setw -g window-status-current-style 'fg=#7aa2f7,bold'
setw -g window-status-style 'fg=#565f89'

# Initialize tpm (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
