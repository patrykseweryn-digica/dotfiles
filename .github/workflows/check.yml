name: Repository checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Install existing check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq just ripgrep zsh
          pipx install uv
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install pre-commit
          curl -fsSL https://herdr.dev/install.sh \
            -o "$RUNNER_TEMP/herdr-install.sh"
          sh "$RUNNER_TEMP/herdr-install.sh"
          npm --prefix config/pi ci --ignore-scripts
      - name: Secure runner Zsh completion permissions
        run: |
          zsh -fc 'autoload -Uz compaudit; compaudit' |
            xargs -r -d '\n' sudo chmod -v go-w
      - name: Check repository
        run: just check
