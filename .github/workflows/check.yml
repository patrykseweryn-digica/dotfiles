name: Repository checks

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-install:
    if: github.event_name != 'push'
    name: Clean install (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run clean Ubuntu install, sync, and machine
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          docker build --progress=plain
          --secret id=github_token,env=GITHUB_TOKEN
          --file .github/ci/clean-install.Dockerfile .

  check:
    strategy:
      fail-fast: false
      matrix:
        os: >-
          ${{ fromJSON(case(github.event_name == 'pull_request' ||
            github.event_name == 'workflow_dispatch',
            '["ubuntu-latest", "macos-latest"]', '["ubuntu-latest"]')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read Node policy
        id: node-policy
        run: |
          policy=$(sed -n 's/^node = "\([^"]*\)"$/\1/p' config/mise/config.toml)
          test "$policy" = lts
          echo "version=${policy}/*" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.node-policy.outputs.version }}
          check-latest: true
      - name: Install existing check tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any \
              update
            sudo apt-get -o Acquire::Retries=5 install -y jq ripgrep zsh
          else
            brew install jq ripgrep zsh pipx
          fi
          pipx install uv
          export PATH="$HOME/.local/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          uv tool install prek
          just_version=$(jq -r '.tools[] |
            select(.package == "rust-just") | .channel' \
            .agents/tool-versions.json)
          uv tool install "rust-just==$just_version"
          curl -fsSL https://herdr.dev/install.sh \
            -o "$RUNNER_TEMP/herdr-install.sh"
          sh "$RUNNER_TEMP/herdr-install.sh"
          npm --prefix config/pi ci --ignore-scripts
      - name: Secure runner Zsh completion permissions
        run: |
          while IFS= read -r directory; do
            sudo chmod -v go-w "$directory"
          done < <(zsh -fc 'autoload -Uz compaudit; compaudit' || true)
      - name: Check repository
        run: just test

  upstream-skills:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read Node policy
        id: node-policy
        run: |
          policy=$(sed -n 's/^node = "\([^"]*\)"$/\1/p' config/mise/config.toml)
          test "$policy" = lts
          echo "version=${policy}/*" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ steps.node-policy.outputs.version }}
          check-latest: true
      - name: Install skill preflight tools
        run: |
          sudo apt-get -o Acquire::Retries=5 -o APT::Update::Error-Mode=any \
            update
          sudo apt-get -o Acquire::Retries=5 install -y jq
          npm install --global skills@latest
      - name: Resolve current upstream skills
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./sync-agents.sh skills-preflight
