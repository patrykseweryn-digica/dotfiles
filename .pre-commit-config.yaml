# prek runs hooks with the same priority concurrently. No hook changes files
# or shares state with another; give such a hook its own priority.
# Fixture dependency coverage is checked by scripts/smoke-hook-filters.py.
# Repo-wide checks opt into deleted paths without passing them as arguments.
minimum_prek_version: '0.5.4' # First release with include_deleted.
repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        files: '^(?!docs/|.*\.md$)'
        args: ["--severity=warning"]
        exclude: '^\.(p10k\.zsh|zshrc)$'
        # Without --external-sources, file batches give the same result.
        require_serial: false
        priority: 0
  - repo: local
    hooks:
      - id: architecture-map
        name: Generated architecture map is current
        entry: python3 scripts/build-architecture.py --check
        language: system
        pass_filenames: false
        # Check for missing or stale artifacts regardless of staged paths.
        always_run: true
        priority: 0
      - id: tool-plan-smoke
        files: >-
          (?x)^(?:Brewfile|\.agents/tool-versions\.json|
          bootstrap\.d/[^/]*\.sh|config/mise/config\.toml|
          scripts/(?:core-tools\.sh|groups\.sh|host-tools\.sh|operation\.sh|
          smoke-tool-plan\.sh))$
        name: Tool install plan smoke test
        description: Ensure Linux/macOS CLI tool install planning stays portable
        entry: ./scripts/smoke-tool-plan.sh
        language: system
        pass_filenames: false
        include_deleted: true
        priority: 0
      - id: zsh-plan-smoke
        files: >-
          (?x)^(?:bootstrap\.d/(?:00-utils\.sh|02-zsh\.sh)|
          scripts/(?:host-tools\.sh|smoke-zsh-plan\.sh))$
        name: Zsh install plan smoke test
        description: >-
          Ensure zsh install picks Homebrew before source fallback
          when sudo is unavailable
        entry: ./scripts/smoke-zsh-plan.sh
        language: system
        pass_filenames: false
        include_deleted: true
        priority: 0
      - id: zshrc-startup-smoke
        files: '^(?:\.zshrc|scripts/smoke-zshrc-startup\.sh)$'
        name: Zshrc startup smoke test
        description: >-
          Ensure .zshrc can be sourced on a fresh machine without noisy
          missing-tool errors
        entry: ./scripts/smoke-zshrc-startup.sh
        language: system
        pass_filenames: false
        include_deleted: true
        priority: 0
      - id: agent-repo-layout-smoke
        files: >-
          (?x)^(?:(?:AGENTS\.md|CLAUDE\.md)|\.agents/(?:AGENTS\.md|
          mcp-servers\.json|plugin-manifest\.json|skill-lock\.json|
          skills/.+|skills-custom(?:/.+)?)|skills-lock\.json(?:/.+)?|
          bin/committer|config/claude/(?:CLAUDE\.md|claude-manifest\.json|
          mcp-servers\.json|settings\.local\.json|skill-lock\.json|skills-custom)|
          config/codex/(?:AGENTS\.md|plugin-manifest\.json|settings\.toml)|
          config/opencode/AGENTS\.md|config/pi/(?:AGENTS\.md|settings\.json)|
          scripts/(?:committer|smoke-agent-repo-layout\.sh))$
        types: [] # Include the tracked symlink inputs.
        name: Agent repo layout smoke test
        description: >-
          Ensure shared agent files stay canonical and tracked symlinks resolve
        entry: ./scripts/smoke-agent-repo-layout.sh
        language: system
        pass_filenames: false
        include_deleted: true
        priority: 0
      - id: install-dotfiles-smoke
        files: >-
          (?x)^(?:(?:\.aliases|\.p10k\.zsh|\.tmux\.conf|\.vimrc|\.zshrc|
          install\.sh|justfile|pythonrc\.py|sync-agents\.sh)|
          \.agents/(?:AGENTS\.md|mcp-servers\.json|plugin-manifest\.json|
