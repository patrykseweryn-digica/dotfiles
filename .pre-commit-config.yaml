repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        exclude: '^\.(p10k\.zsh|zshrc)$'
  - repo: local
    hooks:
      - id: tool-plan-smoke
        name: Tool install plan smoke test
        description: Ensure Linux/macOS CLI tool install planning stays portable
        entry: ./scripts/smoke-tool-plan.sh
        language: system
        pass_filenames: false
      - id: zsh-plan-smoke
        name: Zsh install plan smoke test
        description: Ensure zsh install picks Homebrew before source fallback when sudo is unavailable
        entry: ./scripts/smoke-zsh-plan.sh
        language: system
        pass_filenames: false
      - id: zshrc-startup-smoke
        name: Zshrc startup smoke test
        description: Ensure .zshrc can be sourced on a fresh machine without noisy missing-tool errors
        entry: ./scripts/smoke-zshrc-startup.sh
        language: system
        pass_filenames: false
      - id: agent-repo-layout-smoke
        name: Agent repo layout smoke test
        description: Ensure shared agent files stay canonical and tracked symlinks resolve
        entry: ./scripts/smoke-agent-repo-layout.sh
        language: system
        pass_filenames: false
      - id: install-dotfiles-smoke
        name: Install dotfiles smoke test
        description: Ensure setup_dotfiles links Linux/macOS targets and agent adapters in an isolated HOME
        entry: ./scripts/smoke-install-dotfiles.sh
        language: system
        pass_filenames: false
      - id: ssh-config-smoke
        name: SSH config smoke test
        description: Ensure ssh setup preserves existing config unless replacement is explicit
        entry: ./scripts/smoke-ssh-config.sh
        language: system
        pass_filenames: false
      - id: macos-apps-smoke
        name: macOS apps smoke test
        description: Ensure macOS Brewfile, VS Code extensions, and Rectangle defaults are wired safely
        entry: ./scripts/smoke-macos-apps.sh
        language: system
        pass_filenames: false
      - id: agent-skill-sync-smoke
        name: Agent skill sync smoke test
        description: Ensure shared skills are visible to Codex, Claude Code, and OpenCode
        entry: ./scripts/smoke-agent-skill-sync.sh
        language: system
        pass_filenames: false
      - id: codex-plugin-sync-smoke
        name: Codex plugin sync smoke test
        description: Ensure Codex remote plugin drift and export stay symmetric
        entry: ./scripts/smoke-codex-plugin-sync.sh
        language: system
        pass_filenames: false
      - id: claude-plugin-sync-smoke
        name: Claude plugin sync smoke test
        description: Ensure Claude plugin update and export stay symmetric
        entry: ./scripts/smoke-claude-plugin-sync.sh
        language: system
        pass_filenames: false
      - id: web-scraping-skills-smoke
        name: Web scraping skills smoke test
        description: Ensure web scraping skill routing, gates, and references stay aligned
        entry: ./scripts/smoke-web-scraping-skills.sh
        language: system
        pass_filenames: false
      - id: doctor-smoke
        name: Live machine doctor smoke test
        description: Ensure live drift checks stay outside commit-time hooks
        entry: ./scripts/smoke-doctor.sh
        language: system
        pass_filenames: false
      - id: agent-sync-interface-smoke
        name: Agent sync interface smoke test
        description: Verify symmetric sync commands and normalized MCP behavior
        entry: ./scripts/smoke-agent-sync-interface.sh
        language: system
        pass_filenames: false
      - id: agent-tools-smoke
        name: Agent tools smoke test
        description: Verify agent tool version policy
        entry: ./scripts/smoke-agent-tools.sh
        language: system
        pass_filenames: false
