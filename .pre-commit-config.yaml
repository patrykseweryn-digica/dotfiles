repos:
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        exclude: '^\.(p10k\.zsh|zshrc)$'
  - repo: local
    hooks:
      - id: claude-manifest-sync
        name: Claude manifest sync check
        description: Ensure claude-manifest.json reflects installed plugins
        entry: ./sync-claude.sh export --check
        language: system
        pass_filenames: false
        always_run: true
