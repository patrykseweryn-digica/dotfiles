# Install tree: everything this repository can install or configure on a
# machine. Each table declares one node by its path; a parent comes before
# its children, and the picker shows nodes in this order.
#
# Node keys:
#   label       Short name shown to the owner. Required.
#   required    true: every machine selects the node and its descendants.
#   conditions  Machine facts the node needs: screen, sudo, darwin, linux.
#               Descendants inherit them.
#   requires    Paths of other nodes that the node needs.
#   tools       Names in .agents/tool-versions.json.
#   links       Sources in config/managed-links.tsv.
#   casks       Casks in Brewfile.
#   files       Repository files that install or configure the element,
#               for elements without an inventory entry.
#   derive      skills, plugins or mcp: the elements below come from
#               .agents/skill-lock.json, .agents/plugin-manifest.json or
#               .agents/mcp-servers.json. Skills sit under an author branch
#               (the harness/<author>/ segment of the skill path, else the
#               GitHub account of the source); plugins under a marketplace
#               branch. Declare each author and marketplace branch here.
#   empty       true: a branch without elements on purpose.
#
# Run `uv run --no-project --script scripts/install-tree.py check` to compare
# the tree with the inventories; `just test` runs it.

